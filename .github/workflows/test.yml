name: Test

# Run this job on all pushes and pull requests
on:
  push:
    branches:
      - "*"
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test
  cancel-in-progress: true

jobs:
  # Derive the test matrix from versions.json, the same source of truth the installer,
  # the NPX package and ioBroker.admin read. A version added or dropped there is then
  # picked up here automatically instead of drifting apart.
  node-versions:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Read nodeJsAccepted from versions.json
      id: read
      run: |
        MATRIX=$(jq -c '[.nodeJsAccepted[] | tostring + ".x"]' versions.json)
        echo "Testing against Node.js: $MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # The jobs below point VERSIONS_URL at the branch, so nothing would notice if the
  # real download broke. Keep covering that path here: same URL and same parsing as
  # installer_library.sh, without a full installation.
  versions-url:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
    - name: The runtime download of versions.json still works
      run: |
        URL="https://raw.githubusercontent.com/ioBroker/ioBroker/master/versions.json"
        JSON=$(curl -sL "$URL")
        if [ -z "$JSON" ]; then
          echo "$URL returned nothing - every installation falls back to its built-in defaults"
          exit 1
        fi
        REC=$(echo "$JSON" | grep '"nodeJsRecommended"' | sed 's/.*"nodeJsRecommended"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/')
        ACC=$(echo "$JSON" | sed -n 's/.*"nodeJsAccepted"[[:space:]]*:[[:space:]]*\[\([0-9,[:space:]]*\)\].*/\1/p' | tr ',' ' ')
        echo "recommended=[$REC] accepted=[$ACC]"
        echo "$REC" | grep -qE '^[0-9]+$'
        echo "$ACC" | grep -qE '[0-9]'

  # Lints the shell scripts, which are the bulk of this repository. Severity "error" only:
  # below that there are still hundreds of findings, so a stricter level means fixing those
  # first. Raise it once they are dealt with, do not lower it.
  shellcheck:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run shellcheck
      run: |
        shellcheck --version
        shellcheck -S error \
          installer.sh \
          installer_library.sh \
          fix_installation.sh \
          diag.sh \
          node-update.sh \
          docker.sh \
          .github/testFiles.sh \
          .github/testFreeBSD.sh \
          .github/tuiDrive.sh

    # The runner has Docker preinstalled, so this covers the status path only, not the installation
    - name: Smoke test docker.sh
      run: |
        bash docker.sh --help
        bash docker.sh

    # Hides Docker behind a PATH with only the tools the not-installed path needs (bash too: the
    # command itself is looked up in that PATH). Without a terminal the missing answer counts as
    # "no", so nothing is installed and the exit code is 1.
    - name: Smoke test docker.sh without Docker
      run: |
        nodocker="$RUNNER_TEMP/nodocker"
        mkdir -p "$nodocker"
        for tool in bash uname grep id tr; do ln -s "$(command -v "$tool")" "$nodocker/$tool"; done
        rc=0
        PATH="$nodocker" bash docker.sh </dev/null >"$RUNNER_TEMP/docker.log" 2>&1 || rc=$?
        cat "$RUNNER_TEMP/docker.log"
        test "$rc" -eq 1
        grep -q "Docker:          not installed" "$RUNNER_TEMP/docker.log"
        grep -q "Docker was not installed" "$RUNNER_TEMP/docker.log"

  # ===================
  # Runs unit tests on all supported node versions and OSes
  test-install:
    needs: node-versions
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      # One unsupported version should not hide the result for the others
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(needs.node-versions.outputs.matrix) }}
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    # setup-node only prepends the tool cache to PATH for the steps that follow. The
    # generated systemd unit resolves its interpreter with "which node" at service start,
    # using systemd's own PATH, which never contains the tool cache. Without this link the
    # matrix would only change the Node.js that the install script sees, while ioBroker
    # itself would keep running on the image's default version.
    - name: Make the selected Node.js the system Node.js
      run: |
        sudo ln -sf "$(command -v node)" /usr/local/bin/node
        sudo ln -sf "$(command -v npm)" /usr/local/bin/npm
        /usr/local/bin/node -v

    # installer.sh downloads installer_library.sh from master at runtime, so running it
    # directly would test master's library instead of the one in this branch. The previous
    # attempt to strip that block had no effect: sed without -i writes to stdout, and the
    # sourced functions were gone by the next step anyway.
    # "node tasks --create" inlines the local library into dist/install.sh, which is also
    # the artifact that gets deployed to iobroker.net.
    - name: Build the self-contained installer
      run: node tasks --create

    - name: Install ioBroker
      # Point the installer at this branch's versions.json. It otherwise downloads
      # master's copy at runtime, so a PR editing that file would be verified
      # against values it does not contain - and against the matrix above, which is
      # built from the local file.
      env:
        VERSIONS_URL: file://${{ github.workspace }}/versions.json
      run: bash ./dist/install.sh --silent

    - name: Test permissions
      # TODO: test this on OSX too!
      # runner.os is 'Linux', never 'ubuntu', so the previous startsWith() condition was
      # always false and this step never ran on any runner.
      if: runner.os == 'Linux'
      run: bash .github/testFiles.sh

    # The service needs a while to come up. This used to be a single attempt that only
    # worked because an unrelated "npm install mocha chai" step ran before it and acted
    # as an accidental delay - a race, not a test. Retry instead.
    - name: Test if ioBroker starts by checking the admin adapter output
      run: |
        for i in $(seq 1 36); do
          if curl -s --insecure http://127.0.0.1:8081 | grep -q '<title>Admin</title>'; then
            echo "admin is reachable after $((i * 5))s"
            exit 0
          fi
          sleep 5
        done
        echo "admin did not become reachable within 180s"
        exit 1

    # Guard so the matrix cannot quietly go back to being decorative: resolve "node" the
    # way systemd does when it starts the unit and compare it against the matrix entry.
    - name: Verify the service resolves Node.js ${{ matrix.node-version }}
      if: runner.os == 'Linux'
      run: |
        expected="${{ matrix.node-version }}"
        expected="${expected%.x}"
        actual=$(sudo env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin node -v)
        actual="${actual#v}"
        actual="${actual%%.*}"
        echo "ioBroker would start on Node.js $actual, the matrix asks for $expected"
        test "$actual" = "$expected"

  # ===================
  # Exercises install_nodejs, which no CI run has ever reached: installer.sh only calls it
  # when "node" is absent, and every runner image ships with Node.js preinstalled. The
  # NodeSource path - GPG key import, nodesource.sources, apt pinning - was therefore
  # completely uncovered. Remove Node.js first so the installer has to install it itself.
  test-nodejs-install:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # Must happen before Node.js is removed, "node tasks --create" needs it
    - name: Build the self-contained installer
      run: node tasks --create

    - name: Remove the preinstalled Node.js
      run: |
        sudo apt-get remove -y --purge nodejs npm > /dev/null 2>&1 || true
        sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack
        # The tool cache copy is reachable only through the PATH entries the runner sets up
        printf 'PATH=%s\n' "$(printf '%s' "$PATH" | tr ':' '\n' | grep -v 'hostedtoolcache/node' | paste -sd:)" >> "$GITHUB_ENV"

    # GITHUB_ENV only takes effect in later steps, so assert in a separate one
    - name: Verify Node.js is really gone
      run: |
        if command -v node; then
          echo "node is still on PATH, the installer would skip install_nodejs"
          exit 1
        fi
        echo "no node on PATH, install_nodejs will run"

    - name: Install ioBroker
      # Point the installer at this branch's versions.json. It otherwise downloads
      # master's copy at runtime, so a PR editing that file would be verified
      # against values it does not contain - and against the matrix above, which is
      # built from the local file.
      env:
        VERSIONS_URL: file://${{ github.workspace }}/versions.json
      run: bash ./dist/install.sh --silent

    - name: Verify the installer installed the recommended Node.js from NodeSource
      run: |
        expected=$(jq -r '.nodeJsRecommended' versions.json)
        actual=$(node -v)
        actual="${actual#v}"
        actual="${actual%%.*}"
        echo "installer produced Node.js $actual, versions.json recommends $expected"
        test "$actual" = "$expected"
        test -f /etc/apt/sources.list.d/nodesource.sources
        echo "NodeSource repository is configured"

    - name: Test permissions
      run: bash .github/testFiles.sh

    - name: Test if ioBroker starts by checking the admin adapter output
      run: |
        for i in $(seq 1 36); do
          if curl -s --insecure http://127.0.0.1:8081 | grep -q '<title>Admin</title>'; then
            echo "admin is reachable after $((i * 5))s"
            exit 0
          fi
          sleep 5
        done
        echo "admin did not become reachable within 180s"
        exit 1

  # ===================
  # The interactive display of installer and fixer. Every other job runs without a terminal,
  # where both scripts keep the classic output, so this is the only run of the display path:
  # "script" gives them a terminal, and the keys are typed into it. The keys wait in the
  # terminal until a dialog reads them, so no timing is involved. stdin has to stay open,
  # otherwise "script" ends the session; the leftover sleep is killed afterwards.
  test-tui:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    # See test-install: the systemd unit resolves "node" without the tool cache on PATH
    - name: Make the selected Node.js the system Node.js
      run: |
        sudo ln -sf "$(command -v node)" /usr/local/bin/node
        sudo ln -sf "$(command -v npm)" /usr/local/bin/npm

    - name: Build the self-contained scripts
      run: node tasks --create

    # tuiDrive.sh presses Enter whenever a dialog waits, so the start screen installs with the
    # preselected options. It unsets CI, with which the scripts keep the classic output.
    - name: Install ioBroker with the interactive display
      timeout-minutes: 30
      env:
        VERSIONS_URL: file://${{ github.workspace }}/versions.json
      run: |
        bash .github/tuiDrive.sh install.typescript 40 120 ./dist/install.sh
        # The display was really used, and the installation reached its end
        grep -qaF $'\033[?1049h' install.typescript
        grep -qa "ioBroker was installed successfully" install.typescript

    - name: Test permissions
      run: bash .github/testFiles.sh

    - name: Test if ioBroker starts by checking the admin adapter output
      run: |
        for i in $(seq 1 36); do
          if curl -s --insecure http://127.0.0.1:8081 | grep -q '<title>Admin</title>'; then
            echo "admin is reachable after $((i * 5))s"
            exit 0
          fi
          sleep 5
        done
        echo "admin did not become reachable within 180s"
        exit 1

    - name: Stop ioBroker for the fixer
      run: |
        sudo systemctl stop iobroker
        sleep 10

    # Enter on the start screen repairs with the preselected options, and answers the questions the
    # runner triggers, boot target and timezone, with the preselected "No"
    - name: Run the fixer with the interactive display
      timeout-minutes: 30
      run: |
        bash .github/tuiDrive.sh fix.typescript 24 80 ./dist/fix.sh
        grep -qaF $'\033[?1049h' fix.typescript
        grep -qa "Your installation was fixed successfully" fix.typescript

    - name: Test permissions after the fixer
      run: bash .github/testFiles.sh

    - name: Test if ioBroker starts again after the fixer
      run: |
        sudo systemctl start iobroker
        for i in $(seq 1 36); do
          if curl -s --insecure http://127.0.0.1:8081 | grep -q '<title>Admin</title>'; then
            echo "admin is reachable after $((i * 5))s"
            exit 0
          fi
          sleep 5
        done
        echo "admin did not become reachable within 180s"
        exit 1

    # The screens themselves are escape sequences; the logs hold the output of the steps
    - name: Show the logs of the steps
      if: failure()
      run: |
        for f in ~/iobroker-install.log ~/iobroker-fix.log; do
          echo "::group::$f"
          cat "$f" 2>/dev/null || echo "missing"
          echo "::endgroup::"
        done
        for f in install.typescript fix.typescript; do
          echo "::group::$f, text only"
          sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' -e 's/\x1b[()][A-Za-z0-9]//g' "$f" 2>/dev/null | tail -100 || echo "missing"
          echo "::endgroup::"
        done

  # The display on macOS, with the bash 3.2 of /bin/bash that the installer gets there: the library
  # avoids everything newer, and this is where a slip would show. macOS has the BSD "script",
  # which takes the command after the file and has no -e, so the result is checked in the output.
  test-tui-macos:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Build the self-contained installer
      run: node tasks --create

    - name: Install ioBroker with the interactive display under bash 3.2
      timeout-minutes: 30
      env:
        VERSIONS_URL: file://${{ github.workspace }}/versions.json
      run: |
        /bin/bash --version | head -n 1
        script -q install.typescript /bin/bash -c "stty rows 40 cols 120; env -u CI TERM=xterm-256color /bin/bash ./dist/install.sh" \
          < <(printf '\r'; exec sleep 1700 2>/dev/null) > /dev/null || true
        pkill -f "sleep 1700" || true
        grep -qaF $'\033[?1049h' install.typescript
        grep -qa "ioBroker was installed successfully" install.typescript

    - name: Test if ioBroker starts by checking the admin adapter output
      run: |
        for i in $(seq 1 36); do
          if curl -s --insecure http://127.0.0.1:8081 | grep -q '<title>Admin</title>'; then
            echo "admin is reachable after $((i * 5))s"
            exit 0
          fi
          sleep 5
        done
        echo "admin did not become reachable within 180s"
        exit 1

    - name: Show the log of the steps
      if: failure()
      run: |
        cat ~/iobroker-install.log 2>/dev/null || echo "missing"
        sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' install.typescript 2>/dev/null | tail -100 || true
