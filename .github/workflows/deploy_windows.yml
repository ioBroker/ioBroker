name: Deploy Windows

on:
  push:
    branches:
      - '*'
    tags:
      # normal versions
      - "v?[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v?[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: { }

jobs:
  test-windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: prepare-install
        run: |
          npm i --omit=dev
          npm link
          cd ..
          mkdir iobroker-inst
          cd iobroker-inst

      - name: install
        run: |
          cd ..
          cd iobroker-inst
          npx iobroker

  deploy:
    needs: [test-windows-install]

    # Trigger this step only when a commit on master is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/')

    # npm trusted publishing: both packages name this file as their trusted publisher on npmjs.com,
    # so there is no token, and renaming the file or moving the publish elsewhere breaks the release
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for npm publish

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # trusted publishing needs npm >= 11.5.1; Node.js 22 bundles npm 10
          node-version: 24

      - name: install
        run: npm i

      - name: deploy
        run: npm publish

      - name: deploy fix
        run: |
          npm run make-fix
          npm publish

      - name: Create Github Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pre-release versions create pre-releases on GitHub
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Release v$VERSION" \
            --notes "$(git show -s --format=%b)" "${PRERELEASE[@]}"
