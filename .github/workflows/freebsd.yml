name: Test FreeBSD

# GitHub does not offer a FreeBSD runner, so the installer is exercised in a FreeBSD VM
# on an ubuntu runner. This replaces .cirrus.yml, which covered the same ground but had
# stopped producing check runs on this repository.
on:
  push:
    branches:
      - "*"
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-freebsd
  cancel-in-progress: true

jobs:
  test-install-freebsd:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    # ioBroker currently does not start on FreeBSD, for reasons that predate this workflow
    # and have nothing to do with it: the rc.d pidfile points into a directory that no
    # longer exists in js-controller, detect_ip_address takes the Linux branch and returns
    # nothing, and sed -i is used in the GNU form. Cirrus stopped running in 2024, so none
    # of it was visible. The job reports without blocking until those are fixed; remove
    # this line once FreeBSD installs cleanly again.
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install and test ioBroker in a FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      with:
        release: '14.2'
        usesh: true
        prepare: |
          pkg install -y bash node npm libnghttp2 python sudo curl
        run: |
          bash .github/testFreeBSD.sh
