name: Apply diag.sh tmpfs patch
on:
  push:
    branches: [diag-log-snapshot-tmpfs]
    paths: ['.diag-patch.diff']
permissions:
  contents: write
jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify and apply patch
        run: |
          git apply --check --verbose .diag-patch.diff
          git apply --verbose .diag-patch.diff
          bash -n diag.sh
          rm .diag-patch.diff
          rm -f .github/workflows/apply-diag-patch.yml
      - name: Commit and push
        run: |
          git config user.name "Grothesk242"
          git config user.email "57298681+Grothesk242@users.noreply.github.com"
          git add -A
          git commit -m "diag.sh: keep the log snapshot off tmpfs and detect a failed snapshot write (follow-up to #793)"
          git push
