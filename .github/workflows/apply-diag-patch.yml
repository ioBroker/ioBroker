name: Apply diag.sh comment translation patch
on:
  push:
    branches: [diag-log-snapshot-tmpfs]
    paths: ['.diag-patch.diff']
permissions:
  contents: write
jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify and apply patch
        run: |
          git apply --check --verbose .diag-patch.diff
          git apply --verbose .diag-patch.diff
          bash -n diag.sh
          echo "10dabb70399e2041373c4851d7ce386e8fdab2f866d53567f6802bc534997843  diag.sh" | sha256sum -c -
          echo "4f07d8e99db3e9bb6fa1644c5c96d7caa21c9d44c87977629768a1b0b5ee263c  CHANGELOG_DIAG_LINUX.md" | sha256sum -c -
          rm .diag-patch.diff
          rm -f .github/workflows/apply-diag-patch.yml
      - name: Commit and push
        run: |
          git config user.name "Grothesk242"
          git config user.email "57298681+Grothesk242@users.noreply.github.com"
          git add -A
          git commit -m "diag.sh: translate German comments to English, bump SKRIPTV, add changelog entry"
          git push
